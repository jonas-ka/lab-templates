name: examples
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - name: Scan for private material
        run: |
          ! grep -rnE "/Users/|GoogleDrive-|karthein@|AIza[0-9A-Za-z_-]{20,}|-----BEGIN" --include='*.typ' --include='*.md' --include='*.yaml' --include='*.py' --include='*.sh' . \
            | grep -v "^./.github/workflows/ci.yml" || (echo "private pattern found" && exit 1)
      - name: Compile the examples (PDF/UA-1)
        run: make check

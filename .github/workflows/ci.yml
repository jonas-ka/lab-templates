name: examples
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - name: Scan for private material
        run: |
          ! grep -rnE "/Users/|GoogleDrive-|AIza[0-9A-Za-z_-]{20,}|ya29\.[0-9A-Za-z_-]{20,}|sk-ant-[0-9A-Za-z_-]{20,}|-----BEGIN" --include='*.typ' --include='*.md' --include='*.yaml' --include='*.py' --include='*.sh' --include='*.ipynb' --include='*.json' --include='*.svg' --include='*.yml' . \
            | grep -v "\.github/workflows/ci\.yml:" || (echo "private pattern found" && exit 1)
      - name: Compile the examples (PDF/UA-1)
        run: make check
      - uses: astral-sh/setup-uv@v6
      - name: Install pandoc 3.12 (the log book's rendering)
        run: |
          curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.12/pandoc-3.12-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
      - name: Log-book format (tests incl. EPICS and migration, example book, its PDF and HTML view)
        run: make logbook

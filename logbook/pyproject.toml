[project]
name = "lablogbook"
version = "2026.10.17"
description = "Log-book entries as Markdown files: format, checker, rendering (lab-templates)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
logbook = "lablogbook.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lablogbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
